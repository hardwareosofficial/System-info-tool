name: Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run build script
        run: |
          python build.py

      - name: Run Inno Setup on Windows (optional)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y || true
          if exist SystemInfoTool.iss (
            ISCC.exe SystemInfoTool.iss || echo "ISCC failed or not found"
          )

      - name: Run threaded smoke test on Windows
        if: runner.os == 'Windows'
        run: |
          python -c "import sys, os; sys.path.insert(0, os.getcwd()); from scripts.smoke_test_wmi_thread import worker; print('Smoke test script available')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systeminfotool-${{ matrix.os }}
          path: |
            dist/**
            Output/**
            *.exe
