name: Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run build script
        run: |
          python build.py

      - name: Run Inno Setup on Windows (optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          # Try to install Inno Setup (may require elevated permissions); do not fail the job if it can't be installed
          try {
            choco install innosetup -y
          } catch {
            Write-Host "choco install innosetup failed or requires elevation; skipping installer install"
          }

          if (Test-Path "SystemInfoTool.iss") {
            $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($iscc) {
              Write-Host "Found ISCC.exe — attempting to build installer (errors ignored)..."
              try {
                & ISCC.exe SystemInfoTool.iss
              } catch {
                Write-Host "ISCC.exe run failed; continuing without installer"
              }
            } else {
              Write-Host "ISCC.exe not found on runner — skipping installer build"
            }
          } else {
            Write-Host "No SystemInfoTool.iss present — skipping installer step"
          }

      - name: Run threaded smoke test on Windows
        if: runner.os == 'Windows'
        run: |
          python -c "import sys, os; sys.path.insert(0, os.getcwd()); from scripts.smoke_test_wmi_thread import worker; print('Smoke test script available')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: systeminfotool-${{ matrix.os }}
          path: |
            dist/**
            Output/**
            *.exe
